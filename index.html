<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Test</title>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed; /* ★★★ 這一行是關鍵 ★★★ */
    top: 0;
    left: 0;
  }

  a-scene {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
</style>

  </head>

  <body>
<a-scene
  mindar-image="imageTargetSrc: ./targets/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>
  <a-camera position="0 0 0"></a-camera>

  <!-- Target 0 → Video -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-video
      src="#video1"
      width="1"
      height="0.6"
      position="0 0 0"
    ></a-video>
  </a-entity>

  <!-- Video element -->
  <video
    id="video1"
    src="./videos/video1.mp4"
    loop
    muted
    playsinline
    crossorigin="anonymous"
  ></video>

  <a-assets>
    <!-- WebM 影片 -->
    <video
      id="webmVideo"
      src="./videos/ERB-Scene1.webm"
      loop
      muted
      playsinline
      crossorigin="anonymous"
    ></video>

    <!-- GLB 模型（裡面有 VideoPlane） -->
    <a-asset-item id="model" src="./models/yourModel.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0"></a-camera>

  <!-- Target 0：顯示 GLB + WebM -->
  <a-entity id="ar-anchor" mindar-image-target="targetIndex: 0">
    <a-gltf-model id="modelRoot" src="#model"></a-gltf-model>
  </a-entity>


  
</a-scene>

<script>
  const video = document.querySelector("#video1");

  document.addEventListener("DOMContentLoaded", () => {
    const target0 = document.querySelector('[mindar-image-target="targetIndex: 0"]');

    target0.addEventListener("targetFound", () => {
      video.play();
    });

    target0.addEventListener("targetLost", () => {
      video.pause();
    });
  });

  document.addEventListener("click", () => {
    if (video.paused) video.play();
  });
</script>

  </body>
</html>
