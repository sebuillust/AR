<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Test</title>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
      }
    </style>
  </head>

  <body>

<a-scene
  mindar-image="imageTargetSrc: ./targets/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>
  <a-assets>
    <!-- Target 0 的影片 -->
    <video id="video1" src="./videos/video1.mp4"
      loop muted playsinline crossorigin="anonymous"></video>

    <!-- Target 1 的透明 WebM -->
    <video id="webmVideo" src="./videos/ERB-Scene1.webm"
      loop muted playsinline crossorigin="anonymous"></video>

    <!-- GLB 模型（裡面有 VideoPlane） -->
    <a-asset-item id="model" src="./models/AR-ERB.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0"></a-camera>

  <!-- Target 0 -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-video src="#video1" width="1" height="0.6" position="0 0 0"></a-video>
  </a-entity>

  <!-- Target 1 -->
  <a-entity id="ar-anchor" mindar-image-target="targetIndex: 1">
    <a-gltf-model id="modelRoot" src="#model"></a-gltf-model>
  </a-entity>

</a-scene>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ---------------------------
     Target 0 → 播 video1.mp4
  ----------------------------*/
  const video1 = document.querySelector("#video1");
  const target0 = document.querySelector('[mindar-image-target="targetIndex: 0"]');

  target0.addEventListener("targetFound", () => video1.play());
  target0.addEventListener("targetLost", () => video1.pause());


  /* ---------------------------
     Target 1 → GLB + WebM
  ----------------------------*/
  const webmVideo = document.querySelector("#webmVideo");
  const modelRoot = document.querySelector("#modelRoot");

  modelRoot.addEventListener("model-loaded", () => {
    const mesh = modelRoot.getObject3D("mesh");

    // 找到 GLB 裡的 VideoPlane
    const videoPlane = mesh.getObjectByName("VideoPlane");

    if (videoPlane) {
      const texture = new THREE.VideoTexture(webmVideo);
      texture.encoding = THREE.sRGBEncoding;
      texture.needsUpdate = true;

      /* ---------------------------
         修正透明 WebM 的方向 + 比例
      ----------------------------*/

      // 你的影片是 1000 x 1176 → 比例 = 1000/1176
      const aspect = 1000 / 1176;

      // 設定材質
      videoPlane.material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
      });

      // 修正 plane 尺寸（避免偏移）
      videoPlane.scale.set(1, aspect, 1);

      // 修正方向（打橫 → 旋轉 90°）
      videoPlane.rotation.z = Math.PI / 2;

      // 避免抖動 → 縮小 plane
      videoPlane.scale.multiplyScalar(0.8);
    }
  });

  const anchor = document.querySelector("#ar-anchor");
  anchor.addEventListener("targetFound", () => webmVideo.play());
  anchor.addEventListener("targetLost", () => webmVideo.pause());
});
</script>

  </body>
</html>
