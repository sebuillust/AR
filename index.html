<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Test</title>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed; /* ★★★ 這一行是關鍵 ★★★ */
    top: 0;
    left: 0;
  }

  a-scene {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
</style>

  </head>

  <body>
<a-scene
  mindar-image="imageTargetSrc: ./targets/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>
  <a-camera position="0 0 0"></a-camera>

  <!-- Target 0 → Video 1 -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-video
      src="#video1"
      width="1"
      height="0.6"
      position="0 0 0"
    ></a-video>
  </a-entity>

  <!-- Target 1 → Video 2 -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-video
      src="#video2"
      width="1"
      height="0.6"
      position="0 0 0"
    ></a-video>
  </a-entity>

  <!-- Video elements -->
  <video id="video1" src="./videos/video1.mp4" loop muted playsinline crossorigin="anonymous"></video>
  <video id="video2" src="./videos/video2.mp4" loop muted playsinline crossorigin="anonymous"></video>
</a-scene>

<script>
  const video1 = document.querySelector("#video1");
  const video2 = document.querySelector("#video2");

  document.addEventListener("DOMContentLoaded", () => {
    const target0 = document.querySelector('[mindar-image-target="targetIndex: 0"]');
    const target1 = document.querySelector('[mindar-image-target="targetIndex: 1"]');

    // Target 0
    target0.addEventListener("targetFound", () => video1.play());
    target0.addEventListener("targetLost", () => video1.pause());

    // Target 1
    target1.addEventListener("targetFound", () => video2.play());
    target1.addEventListener("targetLost", () => video2.pause());
  });
</script>

  </body>
</html>
